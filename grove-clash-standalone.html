  /* one full player turn. action:
     {type:'move', idx} | {type:'item', which} | {type:'switch', to} |
     {type:'capture'} | {type:'run'} */
  function* turnScript(action) {
    if (action.type === 'run') { yield* runSeq(); return; }
    if (action.type === 'capture') {
      if (yield* captureSeq()) return;
      if (!(yield* enemyTurn())) return;
      backToMenu(); return;
    }
    if (action.type === 'item') {
      yield* itemSeq(action.which);
      if (!(yield* enemyTurn())) return;
      backToMenu(); return;
    }
    if (action.type === 'switch') {
      yield* switchSeq(action.to, true);
      if (!(yield* enemyTurn())) return;
      backToMenu(); return;
    }
    // attack: both sides act in speed order
    const playerMove = pState.moves[action.idx];
    const enemyMove = BData.aiPick(eState.moves, { atkStage: eState.atkStage, foeHpFrac: pState.hp / pState.stats.maxHp, pp: eState.epp }, rngBattle);
    const pFirst = pState.stats.spe === eState.stats.spe ? rngBattle() < 0.5 : pState.stats.spe > eState.stats.spe;
    const order = pFirst ? [['P', playerMove], ['E', enemyMove]] : [['E', enemyMove], ['P', playerMove]];
    for (const [s, mv] of order) {
      if (sideState(s).hp <= 0) continue;
      // boss reacts by awakening the first time it drops below its threshold
      if (s === 'E' && eState.isBoss && eState.form === 0 && eState.hp > 0 && eState.hp < eState.stats.maxHp * eState.threshold) {
        yield* transformSeq('E');
        continue;
      }
      yield* doMove(s, mv);
      const victim = other(s);
      if (sideState(victim).hp <= 0) {
        yield* faintSeq(victim);
        if (victim === 'E') { yield* victorySeq(); return; }
        if (othersAlive()) { yield* forcedSwitch(); break; }
        yield* defeatSeq(); return;
      }
    }
    backToMenu();
  }

  function* introScript() {
    yield 650; // let the transition reveal finish before the first message
    if (curEnemy && curEnemy.isBoss) { yield* introBoss(); return; }
    yield* say(BData.fmt(BData.MSG.challenge, { T: curEnemy.trainer }));
    yield* say(BData.fmt(BData.MSG.sentOut, { T: curEnemy.trainer, M: eState.name }), { auto: true, hold: 120 });
    yield* spawnIn(enemy, themeOf(eState.id));
    yield 150;
    yield* say(BData.fmt(BData.MSG.go, { A: pState.name }), { auto: true, hold: 120 });
    yield* spawnIn(player, themeOf(pState.id));
    yield 200;
    backToMenu();
  }

  // epic dungeon entrance: the boss looms in atop the cliff through the rift
  function* introBoss() {
    yield* say(BData.MSG.bossAppear1);
    yield* say(BData.MSG.bossAppear2, { auto: true, hold: 200 });
    Cam.play([{ t: 1400, pos: DUNGEON_SHOT.pos, look: DUNGEON_SHOT.look, fov: DUNGEON_SHOT.fov, ease: 'inOutCubic' }]);
    yield* spawnInBoss(enemy);
    yield* say(BData.MSG.bossReveal, { auto: true, hold: 220 });
    yield 150;
    yield* say(BData.fmt(BData.MSG.go, { A: pState.name }), { auto: true, hold: 120 });
    yield* spawnIn(player, themeOf(pState.id));
    yield 200;
    backToMenu();
  }

  function backToMenu() {
    state = 'MENU';
    mode = 'menu';
    menuMode = 'top';
    Cam.idleDrift(true);
    camDefault(550);
  }

  function startTurn(action) {
    Sfx.play('confirm');
    state = 'TURN';
    mode = 'none';
    Cam.idleDrift(false);
    run(turnScript(action));
  }

  // inline "nope" message that returns to a menu without using the turn
  function menuNotice(text, backMode) {
    Sfx.play('buzz');
    state = 'TURN';
    const back = backMode || menuMode;
    run((function* () {
      yield* say(text);
      state = 'MENU';
      mode = 'menu';
      menuMode = back;
      Cam.idleDrift(true);
    })());
  }

  function endBattle(result) {
    state = 'DONE';
    mode = 'none';
    // fully heal the whole party (incl. any monster just captured) after every battle
    for (let i = 0; i < Game.save.party.length; i++) Game.save.party[i].hp = null;
    Game.onBattleEnd(result, curEnemy);
  }

  let rngLocal = M3.rng(99);

  // ----------------------------------------------------------- env build
  function buildStatic() {
    if (staticH) return;
    const parts = [];
    const push = (name, pos, yaw, s) => parts.push({ m: Models.get(name), pos, yaw, s });

    const ground = Models.groundMesh({
      radius: 14.5,
      patches: [
        { x: P_POS[0], z: P_POS[2], rx: 1.15, rz: 0.85, rot: 0.35 },
        { x: M_POS[0], z: M_POS[2], rx: 1.45, rz: 1.0, rot: -0.18 },
      ],
    });

    const r = M3.rng(42);
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + r() * 0.3;
      push('tree' + (i % 3), [Math.cos(a) * 9.5, 0, Math.sin(a) * 9.5], r() * 6.3, 0.85 + r() * 0.45);
    }
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2 + 0.18 + r() * 0.25;
      push('tree' + ((i + 1) % 3), [Math.cos(a) * 12.2, 0, Math.sin(a) * 12.2], r() * 6.3, 1.05 + r() * 0.5);
    }
    push('slab', [REX_POS[0], 0, REX_POS[2]], 0.4, 1.0);
    push('rock0', [3.9, 0, 4.7], 0.7, 1.25);
    push('rock1', [2.0, 0, 5.1], 2.4, 0.9);
    push('rock0', [5.0, 0, 3.5], 4.2, 0.8);
    push('rock1', [-4.9, 0, 3.4], 1.1, 1.1);
    push('bush', [-3.5, 0, 1.0], 0.5, 1.0);
    push('bush', [4.6, 0, 0.3], 2.2, 0.9);
    push('bush', [-2.6, 0, 4.6], 3.9, 1.15);
    push('bush', [-4.2, 0, -2.5], 1.4, 1.0);
    push('bush', [3.4, 0, -3.4], 5.1, 0.85);
    for (let i = 0; i < 60; i++) {
      const a = r() * Math.PI * 2, rad = 2.5 + r() * 5.5;
      const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      if (Math.hypot(x - P_POS[0], z - P_POS[2]) < 1.8) continue;
      if (Math.hypot(x - M_POS[0], z - M_POS[2]) < 2.0) continue;
      push('tuft', [x, 0, z], r() * 6.3, 0.8 + r() * 0.9);
    }

    let total = ground.count;
    for (const p of parts) total += p.m.count;
    const data = new Float32Array(total * 9);
    data.set(ground.data, 0);
    let off = ground.count * 9;
    for (const p of parts)
      off = M3.bakeMesh(data, off, p.m.data, p.m.count, p.pos, p.yaw, p.s);
    staticH = Gfx.upload({ data, count: total });
  }

  // dark rift dungeon: obsidian floor, the boss's cliff, a looming portal
  // backdrop, and a ring of jagged spires.
  function buildDungeon() {
    if (dungeonH) return;
    const parts = [];
    const push = (name, pos, yaw, s) => parts.push({ m: Models.get(name), pos, yaw, s });
    const ground = Models.groundMesh({
      radius: 16, dark: true,
      patches: [
        { x: P_POS[0], z: P_POS[2], rx: 1.2, rz: 0.9, rot: 0.3 },
        { x: BOSS_POS[0], z: BOSS_POS[2], rx: 2.8, rz: 2.8, rot: 0 },
      ],
    });
    push('cliff', [BOSS_POS[0], 0, BOSS_POS[2]], 0.2, 1.0);                       // boss perch
    push('portal', [BOSS_POS[0] + 0.4, 1.4, BOSS_POS[2] + 3.0], YAW_M, 2.1);      // looming rift backdrop
    const r = M3.rng(909);
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + r() * 0.2, rad = 11 + r() * 3;
      push('spire', [Math.cos(a) * rad, 0, Math.sin(a) * rad], r() * 6.3, 0.8 + r() * 1.1);
    }
    for (let i = 0; i < 8; i++) {
      const a = r() * Math.PI * 2, rad = 4 + r() * 5;
      const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      if (Math.hypot(x - P_POS[0], z - P_POS[2]) < 2.0) continue;
      if (Math.hypot(x - BOSS_POS[0], z - BOSS_POS[2]) < 3.2) continue;
      push('spire', [x, 0, z], r() * 6.3, 0.4 + r() * 0.5);
    }
    let total = ground.count;
    for (const p of parts) total += p.m.count;
    const data = new Float32Array(total * 9);
    data.set(ground.data, 0);
    let off = ground.count * 9;
    for (const p of parts)
      off = M3.bakeMesh(data, off, p.m.data, p.m.count, p.pos, p.yaw, p.s);
    dungeonH = Gfx.upload({ data, count: total });
  }

  // ----------------------------------------------------------- scene API
  function enter(params) {
    params = params || {};
    Fx.clear();
    t = 0;
    tw = UI.typewriter();
    rngBattle = M3.rng((Math.random() * 1e9) | 0);
    rngLocal = M3.rng((Math.random() * 1e9) | 0);

    curEnemy = params.enemy || { species: 'MAGMULE', level: 15, trainer: 'Camper REX', npcId: 'rex' };
    arena = params.arena || 'grove';
    if (arena === 'dungeon') { buildDungeon(); curStatic = dungeonH; curEnv = DUNGEON_ENV; defShot = DUNGEON_SHOT; }
    else { buildStatic(); curStatic = staticH; curEnv = ENV; defShot = DEFAULT_SHOT; }
    ashT = 0.4; riftT = 1.2;

    // build party combat states from the save
    pParty = Game.save.party.map((m) => {
      const sp = BData.SPECIES[m.species];
      const stats = BData.statsFor(m.species, m.level);
      const hp = m.hp === null || m.hp === undefined ? stats.maxHp : M3.clamp(m.hp, 0, stats.maxHp);
      const pp = (sp.ppInit || sp.moves.map((id) => BData.MOVES[id].pp)).slice();
      return { id: m.species, name: sp.name, level: m.level, stats,
               hp, displayHp: hp, drainRate: 60, atkStage: 0, form: 0,
               moves: sp.moves.slice(), pp };
    });
    activeIdx = Math.max(0, pParty.findIndex((m) => m.hp > 0));
    pState = pParty[activeIdx];

    // enemy combat state from the descriptor (any species; boss-aware)
    const eId = curEnemy.species, eLv = curEnemy.level || 15;
    const esp = BData.SPECIES[eId];
    const eStats = BData.statsFor(eId, eLv);
    const epp = {}; for (const id of esp.moves) epp[id] = BData.MOVES[id].pp;
    eState = { id: eId, baseId: eId, name: esp.name, level: eLv, stats: eStats,
               hp: eStats.maxHp, displayHp: eStats.maxHp, drainRate: 60, atkStage: 0,
               moves: esp.moves.slice(), epp, isBoss: !!curEnemy.isBoss, form: 0, threshold: 0.55 };

    const ePos = arena === 'dungeon' ? BOSS_POS : M_POS;
    player = actor(modelOf(pState.id), P_POS, YAW_P);
    enemy = actor(modelOf(eId), ePos, YAW_M);
    if (eState.isBoss) { enemy.bobAmp = 0.05; enemy.bobRate = 1.0; } // slow looming menace
    rex = actor(curEnemy.trainerModel || 'rex_raised', REX_POS, YAW_M + 0.15);
    items = { heal: BData.ITEMS.heal.uses, cure: BData.ITEMS.cure.uses };
    expFrac = 0.30; expTween = null;
    topCursor = 0; moveCursor = 0; itemCursor = 0; partyCursor = 0;
    awaitParty = false; pickedAlly = -1;
    ball.visible = false; ball.flight = null;

    if (params.fly) {
      state = 'FLY';
      mode = 'none';
      player.visible = enemy.visible = true;
      fly = { yaw: YAW_P, pitch: -0.12 };
      Cam.cut(defShot.pos, defShot.look, defShot.fov);
    } else {
      state = 'INTRO';
      mode = 'none';
      player.visible = enemy.visible = false;
      if (arena === 'dungeon')
        Cam.cut([P_POS[0] - DIR_PM[0] * 1.0, 0.4, P_POS[2] - DIR_PM[2] * 1.0], [BOSS_POS[0], 2.0, BOSS_POS[2]], 56);
      else {
        Cam.cut([4.8, 3.1, 6.6], [0, 0.9, 0.2], 44);
        Cam.play([{ t: 2300, pos: defShot.pos, look: defShot.look, fov: defShot.fov, ease: 'inOutCubic' }]);
      }
      run(introScript());
    }
  }

  // ----------------------------------------------------------- menu input
  function nav2x2(cur, count) {
    let c = cur;
    if (Input.pressed('up')) c = c & ~2;
    if (Input.pressed('down')) c = c | 2;
    if (Input.pressed('left')) c = c & ~1;
    if (Input.pressed('right')) c = c | 1;
    if (c >= count) c = count - 1;
    return c;
  }

  function hitRects(rects, count) {
    if (!Input.mouse.inside) return -1;
    for (let i = 0; i < rects.length && i < count; i++) {
      const r = rects[i];
      if (Input.mouse.x >= r.x && Input.mouse.x <= r.x + r.w &&
          Input.mouse.y >= r.y && Input.mouse.y <= r.y + r.h) return i;
    }
    return -1;
  }

  function partyRows() {
    return pParty.map((m, i) => ({
      name: m.name, lv: m.level,
      hp: Math.round(m.displayHp), maxHp: m.stats.maxHp,
      frac: m.displayHp / m.stats.maxHp,
      fainted: m.hp <= 0, active: i === activeIdx,
    }));
  }

  function handlePartyNav(forced) {
    const n = pParty.length;
    if (Input.pressed('up')) { partyCursor = (partyCursor + n - 1) % n; Sfx.play('cursor'); }
    if (Input.pressed('down')) { partyCursor = (partyCursor + 1) % n; Sfx.play('cursor'); }
    const hov = hitRects(UI.PARTY_ROW_RECTS, pParty.length);
    if (hov >= 0) partyCursor = hov;
    const clicked = hov >= 0 && Input.mouse.clicked;
    if (Input.pressed('confirm') || clicked) {
      const m = pParty[partyCursor];
      if (partyCursor === activeIdx || m.hp <= 0) { Sfx.play('buzz'); return; }
      if (forced) { Sfx.play('confirm'); pickedAlly = partyCursor; }
      else startTurn({ type: 'switch', to: partyCursor });
      return;
    }
    if (!forced && (Input.pressed('back') || Input.pressed('party'))) {
      Sfx.play('cursor');
      menuMode = 'top';
    }
  }

  function updateMenu() {
    if (menuMode === 'party') { handlePartyNav(false); return; }

    if (Input.pressed('party')) { Sfx.play('cursor'); menuMode = 'party'; partyCursor = activeIdx; return; }

    if (menuMode === 'top') {
      const prev = topCursor;
      topCursor = nav2x2(topCursor, 4);
      if (topCursor !== prev) Sfx.play('cursor');
      const hov = hitRects(UI.MOVE_RECTS, 4);
      if (hov >= 0) topCursor = hov;
      // party row hotspot
      const hs = UI.PARTY_ROW_HOTSPOT;
      if (Input.mouse.inside && Input.mouse.clicked &&
          Input.mouse.x >= hs.x && Input.mouse.x <= hs.x + hs.w &&
          Input.mouse.y >= hs.y && Input.mouse.y <= hs.y + hs.h) {
        Sfx.play('cursor'); menuMode = 'party'; partyCursor = activeIdx; return;
      }
      if (Input.pressed('confirm') || (hov >= 0 && Input.mouse.clicked)) {
        const pick = hov >= 0 && Input.mouse.clicked ? hov : topCursor;
        topCursor = pick;
        if (pick === 0) { Sfx.play('cursor'); menuMode = 'items'; itemCursor = 0; }
        else if (pick === 1) {
          if (Game.save.party.length >= 6) menuNotice(BData.MSG.partyFull);
          else startTurn({ type: 'capture' });
        }
        else if (pick === 2) startTurn({ type: 'run' });
        else { Sfx.play('cursor'); menuMode = 'moves'; moveCursor = 0; }
        return;
      }
      if (Input.pressed('back')) Sfx.play('buzz');
      return;
    }

    if (menuMode === 'moves') {
      const count = pState.moves.length;
      const prev = moveCursor;
      moveCursor = nav2x2(moveCursor, count);
      if (moveCursor !== prev) Sfx.play('cursor');
      const hov = hitRects(UI.MOVE_RECTS, count);
      if (hov >= 0) moveCursor = hov;
      if (Input.pressed('confirm') || (hov >= 0 && Input.mouse.clicked)) {
        if (pState.pp[moveCursor] <= 0) { menuNotice(BData.MSG.noPp); return; }
        startTurn({ type: 'move', idx: moveCursor });
        return;
      }
      if (Input.pressed('back')) { Sfx.play('cursor'); menuMode = 'top'; }
      return;
    }

    if (menuMode === 'items') {
      const prev = itemCursor;
      itemCursor = nav2x2(itemCursor, 3);
      if (itemCursor !== prev) Sfx.play('cursor');
      const hov = hitRects(UI.MOVE_RECTS, 3);
      if (hov >= 0) itemCursor = hov;
      if (Input.pressed('confirm') || (hov >= 0 && Input.mouse.clicked)) {
        if (itemCursor === 2) { Sfx.play('cursor'); menuMode = 'top'; return; }
        const which = itemCursor === 0 ? 'heal' : 'cure';
        if (items[which] <= 0) { menuNotice(BData.MSG.noneLeft, 'top'); return; }
        startTurn({ type: 'item', which });
        return;
      }
      if (Input.pressed('back')) { Sfx.play('cursor'); menuMode = 'top'; }
    }
  }

  function updateFly(rawDt) {
    const f = fly;
    const sp = (Input.held('fast') ? 9 : 3.5) * rawDt;
    f.yaw += ((Input.held('lookLeft') ? 1 : 0) - (Input.held('lookRight') ? 1 : 0)) * 1.8 * rawDt;
    f.pitch = M3.clamp(f.pitch + ((Input.held('lookUp') ? 1 : 0) - (Input.held('lookDown') ? 1 : 0)) * 1.2 * rawDt, -1.3, 1.3);
    const fwd = [Math.sin(f.yaw) * Math.cos(f.pitch), Math.sin(f.pitch), Math.cos(f.yaw) * Math.cos(f.pitch)];
    const right = [fwd[2], 0, -fwd[0]];
    const mv = [0, 0, 0];
    M3.addScaled(mv, mv, fwd, -Input.axisY() * sp);
    M3.addScaled(mv, mv, right, Input.axisX() * sp);
    mv[1] += ((Input.held('rise') ? 1 : 0) - (Input.held('fall') ? 1 : 0)) * sp;
    M3.add(Cam.cur.pos, Cam.cur.pos, mv);
    M3.set(Cam.cur.look,
      Cam.cur.pos[0] + fwd[0] * 5, Cam.cur.pos[1] + fwd[1] * 5, Cam.cur.pos[2] + fwd[2] * 5);
    if (Input.pressed('pose')) {
      poseText = JSON.stringify(Cam.pose());
      console.log('CAMERA POSE', poseText);
    }
  }

  function update(rawDt) {
    const dt = rawDt * Fx.timeScale();
    t += dt;
    Cam.update(dt);
    stepTweens(dt);
    stepScript(dt);
    tw.update(dt);

    // ball flight (parabolic arc + spin + trail)
    if (ball.flight) {
      const f = ball.flight;
      f.t += dt;
      const u = Math.min(1, f.t / f.dur);
      ball.pos[0] = M3.lerp(f.from[0], f.to[0], u);
      ball.pos[2] = M3.lerp(f.from[2], f.to[2], u);
      ball.pos[1] = M3.lerp(f.from[1], f.to[1], u) + f.arc * Math.sin(u * Math.PI);
      ball.rot[2] -= dt * 13;
      if (ball.trail) Fx.streak(ball.pos, { colors: [[1, 1, 1], [1, 0.5, 0.45]], s: 0.045 });
      if (u >= 1) ball.flight = null;
    }

    for (const st of pParty.concat([eState])) {
      if (Math.abs(st.displayHp - st.hp) > 0.01) {
        const dir = st.hp > st.displayHp ? 1 : -1;
        st.displayHp += dir * st.drainRate * dt;
        if ((dir > 0 && st.displayHp > st.hp) || (dir < 0 && st.displayHp < st.hp)) st.displayHp = st.hp;
      }
    }
    if (expTween) {
      expTween.t += dt;
      expFrac = M3.lerp(expTween.from, expTween.to, M3.ease.outCubic(M3.clamp(expTween.t / expTween.dur, 0, 1)));
      if (expTween.t >= expTween.dur) expTween = null;
    }
    for (const a of [player, enemy, rex]) {
      if (a.flashT > 0) a.flashT -= dt;
      if (a.shiverT > 0) a.shiverT -= dt;
      if (a.trailT > 0) {
        a.trailT -= dt;
        Fx.streak([a.pos[0] + a.offset[0], a.pos[1] + a.offset[1], a.pos[2] + a.offset[2]],
                  { colors: [[1, 1, 1], [0.95, 0.85, 0.55]], s: 0.09 });
      }
    }

    // dungeon atmosphere: drifting ash, periodic void-lightning + rift pulses
    if (arena === 'dungeon' && state !== 'DONE') {
      ashT -= dt;
      if (ashT <= 0) {
        ashT = 0.05;
        Fx.spawn({ p: [(Math.random() - 0.5) * 16, 7, (Math.random() - 0.5) * 10 + 3], c: [0.5, 0.3, 0.7],
                   v: [0, -1.4 - Math.random(), 0], drag: 0.1, life: 2.2, s: 0.03, s1: 0.01 });
      }
      riftT -= dt;
      if (riftT <= 0) {
        // strike far more often while an action plays — "raid" intensity
        const acting = state === 'TURN';
        riftT = (acting ? 0.9 : 2.4) + Math.random() * (acting ? 1.0 : 3);
        Fx.flash(110, acting ? 0.28 : 0.22, [0.6, 0.3, 0.95]);
        Fx.pulseLight([BOSS_POS[0], BOSS_POS[1] + 1.6, BOSS_POS[2]], [0.66, 0.42, 1], acting ? 1.8 : 1.3, 240, 9);
        Fx.addTrauma(acting ? 0.14 : 0.1);
        Fx.burst([BOSS_POS[0], BOSS_POS[1] + 1.5, BOSS_POS[2] + 1.5], { n: 8, speed: 2, colors: [[0.7, 0.3, 1], [1, 1, 1]], life: 0.5, g: -1 });
      }
    }

    if (state === 'MENU') updateMenu();
    else if (awaitParty) handlePartyNav(true);
    else if (state === 'FLY') updateFly(rawDt);
  }

  function render3d(aspect) {
    const { view, proj } = Cam.matrices(aspect);
    curEnv.point = Fx.lightState(); // attacks pulse a colored light into the arena
    Gfx.begin(view, proj, curEnv);
    Gfx.draw(curStatic, null, {});
    if (enemy.visible) Gfx.draw(enemy.h, actorMat(enemy), { flash: enemy.flashT > 0 ? M3.clamp(enemy.flashT / 0.25, 0, 1) : 0 });
    if (player.visible) Gfx.draw(player.h, actorMat(player), { flash: player.flashT > 0 ? M3.clamp(player.flashT / 0.25, 0, 1) : 0 });
    if (arena === 'grove') Gfx.draw(rex.h, actorMat(rex), {});
    if (ball.visible)
      Gfx.draw(Game.handle('ball'), M3.trs(mTmp2, ball.pos, ball.rot, ball.scl), {});
    const pd = Fx.particleData();
    Gfx.drawDynamic(pd.data, pd.count);
  }

  function renderUi(ctx) {
    UI.redFrame(ctx);
    UI.enemyPanel(ctx, {
      name: eState.name, lv: eState.level,
      hpFrac: eState.displayHp / eState.stats.maxHp,
      party: ['faded', 'full', 'empty', 'empty', 'empty', 'empty'],
    });
    UI.playerPanel(ctx, {
      name: pState.name, lv: pState.level,
      hp: Math.round(pState.displayHp), maxHp: pState.stats.maxHp,
      hpFrac: pState.displayHp / pState.stats.maxHp,
      expFrac,
    });
    if (mode === 'menu') {
      const balls = [];
      for (let i = 0; i < 6; i++)
        balls.push(i < pParty.length ? (pParty[i].hp > 0 ? 'full' : 'faded') : 'empty');
      UI.playerParty(ctx, balls);
      UI.partyHint(ctx);
      UI.emblem(ctx, 452, 426);
      if (menuMode === 'top') {
        UI.actionGrid(ctx, [
          { label: 'Items', style: 'ITEMS', sub: 'x' + (items.heal + items.cure) },
          { label: 'Capture', style: 'CAPTURE' },
          { label: 'Run', style: 'RUN' },
          { label: 'Attack', style: 'ATTACK' },
        ], topCursor, t);
      } else if (menuMode === 'moves') {
        const moves = pState.moves.map((id, i) => ({
          name: BData.MOVES[id].name, type: BData.MOVES[id].type,
          pp: pState.pp[i], maxPp: BData.MOVES[id].pp,
        }));
        UI.moveGrid(ctx, moves, moveCursor, t);
      } else if (menuMode === 'items') {
        UI.actionGrid(ctx, [
          { label: 'Heal', style: 'HEAL', sub: 'x' + items.heal, disabled: items.heal <= 0 },
          { label: 'Cure', style: 'CURE', sub: 'x' + items.cure, disabled: items.cure <= 0 },
          { label: 'Back', style: 'BACK' },
        ], itemCursor, t);
      } else if (menuMode === 'party') {
        UI.partyPanel(ctx, partyRows(), partyCursor, t, false);
      }
    } else if (mode === 'msg') {
      UI.msgBox(ctx, tw, t, waitingConfirm);
    }
    if (awaitParty)
      UI.partyPanel(ctx, partyRows(), partyCursor, t, true);
    if (state === 'FLY') {
      UI.hint(ctx, ['FLY MODE: WASD move, IJKL look, R/F up/down, Shift fast', 'P: print camera pose', poseText]);
    }
  }

  function exit() { Fx.clear(); Cam.idleDrift(false); }

  return { enter, update, render3d, renderUi, exit };
})();
</script>
<script>
/* Grove Clash — js/overworld.js
   Overworld: a large walkable forest at dusk. WASD movement with a smooth
   third-person follow camera and circle collision. Several trainer NPCs
   are scattered around (each a focused 1v1 battle); a dark rift portal at
   the far edge leads to the dungeon boss. Campfire embers, fireflies and
   a swirling portal give the world atmosphere. */
const Overworld = (() => {

  const ENV = {
    sky: M3.hex('#152238'),
    fog: M3.hex('#16261e'), fogNear: 12, fogFar: 30,
    lightDir: M3.normalize([], [-0.4, -0.75, 0.3]),
    lightCol: [0.82, 0.72, 0.58],
    ambient: [0.46, 0.52, 0.48],
  };

  const SPAWN = [-6, 0, -6];
  const FIRE_POS = [8.6, 0, 4.2];
  const PORTAL_POS = [0, 0, 15.4];
  const BOUND = 16.5;

  // trainer NPCs — one monster each. dlg keys live in BData.DIALOGUE.
  const NPCS = [
    { id: 'rex',   name: 'Camper REX', pos: [7, 0, 3.2],   model: 'rex_idle',  battleModel: 'rex_raised',
      enemy: { species: 'MAGMULE', level: 14 } },
    { id: 'hiker', name: 'Hiker DALE', pos: [-11, 0, 6],   model: 'npc_hiker', battleModel: 'npc_hiker',
      enemy: { species: 'THORNLET', level: 12 } },
    { id: 'lass',  name: 'Lass IVY',   pos: [12, 0, -8],   model: 'npc_lass',  battleModel: 'npc_lass',
      enemy: { species: 'EMBERIK', level: 13 } },
    { id: 'ace',   name: 'Ace KORU',   pos: [-8.5, 0, -12], model: 'npc_ace',  battleModel: 'npc_ace',
      enemy: { species: 'MAGMULE', level: 16 } },
  ];

  let staticH = null;
  const colliders = [];

  let hero = null;
  let camYaw = 0;
  let bobT = 0, stepT = 0, moving = false;
  let dialogue = null;       // {lines, idx, tw, onDone}
  let pendingAction = null;  // fn run when dialogue closes
  let cardT = 0, hintT = 0, t = 0;
  let fireflyT = 0, emberT = 0, swirlT = 0;

  function buildStatic() {
    if (staticH) return;
    colliders.length = 0;
    const parts = [];
    const push = (name, pos, yaw, s) => parts.push({ m: Models.get(name), pos, yaw, s });
    const ground = Models.groundMesh({
      radius: 22,
      patches: [
        { x: FIRE_POS[0], z: FIRE_POS[2], rx: 2.4, rz: 1.9, rot: 0.2 },
        { x: SPAWN[0], z: SPAWN[2], rx: 1.4, rz: 1.1, rot: 0.9 },
        { x: PORTAL_POS[0], z: PORTAL_POS[2], rx: 3.2, rz: 2.6, rot: 0 },
      ],
    });
    const r = M3.rng(7);
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2 + r() * 0.25;
      push('tree' + (i % 3), [Math.cos(a) * 15, 0, Math.sin(a) * 15], r() * 6.3, 0.95 + r() * 0.45);
    }
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + 0.13 + r() * 0.2;
      push('tree' + ((i + 2) % 3), [Math.cos(a) * 19, 0, Math.sin(a) * 19], r() * 6.3, 1.1 + r() * 0.55);
    }
    // a few inner trees for depth (kept clear of NPCs / paths)
    const innerTrees = [[4, 0, -6], [-4, 0, 8], [10, 0, 9], [-13, 0, -3], [3, 0, 11]];
    for (const p of innerTrees) push('tree' + (Math.floor(r() * 3)), p, r() * 6.3, 0.9 + r() * 0.4);

    const props = [
      ['rock0', [9.5, 0, 0.4], 0.4, 1.2], ['rock1', [6.5, 0, 6.2], 1.9, 0.95],
      ['rock1', [-9.5, 0, 3.5], 0.9, 1.3], ['rock0', [-2, 0, 9.5], 3.4, 1.0],
      ['rock0', [13, 0, -3], 2.1, 1.1], ['rock1', [-12, 0, -8], 5.0, 1.2],
      ['bush', [-5, 0, 5], 0.6, 1.1], ['bush', [4, 0, -9], 2.8, 1.0],
      ['bush', [-9, 0, -2], 4.4, 1.1], ['bush', [2, 0, 9], 1.2, 0.95],
      ['bush', [11, 0, -2], 5.3, 1.0], ['bush', [-3, 0, -8], 0.9, 1.05],
      ['campfire', FIRE_POS, 0.3, 1.15],
    ];
    for (const [n, p, y, s] of props) {
      push(n, p, y, s);
      if (n.indexOf('rock') === 0) colliders.push({ x: p[0], z: p[2], r: 0.9 * s });
      else if (n === 'bush') colliders.push({ x: p[0], z: p[2], r: 0.7 * s });
      else if (n === 'campfire') colliders.push({ x: p[0], z: p[2], r: 0.8 });
    }
    // the rift portal at the far edge
    push('portal', PORTAL_POS, Math.PI, 1.35);
    colliders.push({ x: PORTAL_POS[0], z: PORTAL_POS[2], r: 1.1 });
    // NPC colliders
    for (const n of NPCS) colliders.push({ x: n.pos[0], z: n.pos[2], r: 0.55 });

    for (let i = 0; i < 90; i++) {
      const a = r() * Math.PI * 2, rad = 2 + r() * 12;
      const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      if (Math.hypot(x - FIRE_POS[0], z - FIRE_POS[2]) < 1.6) continue;
      push('tuft', [x, 0, z], r() * 6.3, 0.8 + r() * 0.9);
    }
    let total = ground.count;
    for (const p of parts) total += p.m.count;
    const data = new Float32Array(total * 9);
    data.set(ground.data, 0);
    let off = ground.count * 9;
    for (const p of parts)
      off = M3.bakeMesh(data, off, p.m.data, p.m.count, p.pos, p.yaw, p.s);
    staticH = Gfx.upload({ data, count: total });
  }

  function enter(params) {
    params = params || {};
    buildStatic();
    Fx.clear();
    const m = Models.get('hero');
    if (!hero) hero = { pos: SPAWN.slice(), yaw: 0, h: Game.handle('hero'), height: m.height };
    // NPC actors face the centre of the clearing
    for (const n of NPCS) { n.h = Game.handle(n.model); n.yaw = Math.atan2(-n.pos[0], -n.pos[2]); }
    if (params.result === 'loss') { M3.set(hero.pos, SPAWN[0], 0, SPAWN[2]); }
    else if (params.fromDungeon) { M3.set(hero.pos, PORTAL_POS[0], 0, PORTAL_POS[2] - 3.2); }
    else if (params.result) { M3.set(hero.pos, 1.5, 0, 0.5); }
    hero.yaw = Math.atan2(-hero.pos[0], -hero.pos[2]);
    camYaw = hero.yaw;
    Cam.cut([hero.pos[0] - Math.sin(camYaw) * 4.4, 2.3, hero.pos[2] - Math.cos(camYaw) * 4.4],
            [hero.pos[0], 1.0, hero.pos[2]], 46);
    dialogue = null;
    pendingAction = null;
    cardT = params.result || params.fromDungeon ? 0 : 4.2;
    hintT = params.result || params.fromDungeon ? 0 : 9;
    t = 0;
  }

  // nearest interactable (npc or portal) within reach, or null
  function nearest() {
    let best = null, bestD = 2.2;
    for (const n of NPCS) {
      const d = M3.dist(hero.pos, n.pos);
      if (d < bestD) { bestD = d; best = { kind: 'npc', npc: n }; }
    }
    const pd = M3.dist(hero.pos, PORTAL_POS);
    if (pd < 2.8 && pd < bestD + 0.6) best = { kind: 'portal' };
    return best;
  }

  function startDialogue(lines, onDone) {
    dialogue = { lines: lines.slice(), idx: 0, tw: UI.typewriter(), onDone };
    dialogue.tw.set(lines[0]);
    Sfx.play('confirm');
  }

  function interact(target) {
    if (target.kind === 'portal') {
      const lines = Game.save.bossBeaten ? BData.DIALOGUE.portalDone : BData.DIALOGUE.portal;
      startDialogue(lines, () => Game.toDungeon());
      return;
    }
    const n = target.npc;
    n.yaw = Math.atan2(hero.pos[0] - n.pos[0], hero.pos[2] - n.pos[2]);
    hero.yaw = Math.atan2(n.pos[0] - hero.pos[0], n.pos[2] - hero.pos[2]);
    const dlg = BData.DIALOGUE[n.id] || {};
    if (Game.save.npcs[n.id]) {
      startDialogue(dlg.beaten || ['...'], null); // already beaten: just chat
    } else {
      startDialogue(dlg.intro || ['Let us battle!'], () =>
        Game.toBattle({ arena: 'grove', npcId: n.id,
          enemy: { species: n.enemy.species, level: n.enemy.level, trainer: n.name, npcId: n.id, trainerModel: n.battleModel } }));
    }
  }

  function updateDialogue(dt) {
    dialogue.tw.update(dt);
    if (Input.pressed('confirm') || Input.mouse.clicked) {
      if (!dialogue.tw.done()) { dialogue.tw.skip(); return; }
      dialogue.idx++;
      if (dialogue.idx < dialogue.lines.length) {
        dialogue.tw.set(dialogue.lines[dialogue.idx]);
        Sfx.play('blip');
      } else {
        const done = dialogue.onDone;
        dialogue = null;
        if (done) done();
      }
    }
  }

  function update(rawDt) {
    const dt = rawDt * Fx.timeScale();
    t += dt;
    if (cardT > 0) cardT -= dt;
    if (hintT > 0) hintT -= dt;

    if (dialogue) { updateDialogue(dt); moving = false; }
    else if (!Fx.transitioning()) {
      const ax = Input.axisX(), az = Input.axisY();
      moving = !!(ax || az);
      if (moving) {
        const fwd = [Math.sin(camYaw), 0, Math.cos(camYaw)];
        const right = [-fwd[2], 0, fwd[0]];
        const mv = [0, 0, 0];
        M3.addScaled(mv, mv, fwd, -az);
        M3.addScaled(mv, mv, right, ax);
        M3.normalize(mv, mv);
        const sp = 4.0 * dt;
        hero.pos[0] += mv[0] * sp;
        hero.pos[2] += mv[2] * sp;
        const targetYaw = Math.atan2(mv[0], mv[2]);
        let dy = targetYaw - hero.yaw;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        hero.yaw += dy * Math.min(1, dt * 12);
        let dc = hero.yaw - camYaw;
        while (dc > Math.PI) dc -= Math.PI * 2;
        while (dc < -Math.PI) dc += Math.PI * 2;
        camYaw += dc * Math.min(1, dt * 1.7);
        bobT += dt * 9;
        stepT -= dt;
        if (stepT <= 0) { Sfx.play('step'); stepT = 0.3; }
      }
      const d0 = Math.hypot(hero.pos[0], hero.pos[2]);
      if (d0 > BOUND) { hero.pos[0] *= BOUND / d0; hero.pos[2] *= BOUND / d0; }
      for (const c of colliders) {
        const dx = hero.pos[0] - c.x, dz = hero.pos[2] - c.z;
        const d = Math.hypot(dx, dz), min = c.r + 0.32;
        if (d < min && d > 0.0001) { hero.pos[0] = c.x + dx / d * min; hero.pos[2] = c.z + dz / d * min; }
      }
      const near = nearest();
      if (near && Input.pressed('confirm')) interact(near);
    }

    // atmosphere: fireflies, campfire embers, and a swirling portal
    fireflyT -= dt;
    if (fireflyT <= 0) {
      fireflyT = 0.5;
      const a = Math.random() * Math.PI * 2, rad = 3 + Math.random() * 11;
      Fx.spawn({ p: [Math.cos(a) * rad, 0.4 + Math.random() * 1.2, Math.sin(a) * rad], c: [0.65, 1, 0.45],
                 v: [(Math.random() - 0.5) * 0.4, 0.12, (Math.random() - 0.5) * 0.4], g: 0, drag: 0.2, life: 2.6 + Math.random() * 2, s: 0.035, s1: 0.01 });
    }
    emberT -= dt;
    if (emberT <= 0) {
      emberT = 0.14;
      Fx.spawn({ p: [FIRE_POS[0] + (Math.random() - 0.5) * 0.25, 0.25, FIRE_POS[2] + (Math.random() - 0.5) * 0.25],
                 c: [[1, 0.48, 0.16], [1, 0.72, 0.2], [0.95, 0.3, 0.1]][Math.floor(Math.random() * 3)],
                 v: [(Math.random() - 0.5) * 0.3, 0.9 + Math.random() * 0.7, (Math.random() - 0.5) * 0.3], g: 0.4, drag: 0.4, life: 0.7 + Math.random() * 0.5, s: 0.06, s1: 0.01 });
    }
    swirlT -= dt;
    if (swirlT <= 0) {
      swirlT = 0.05;
      const a = t * 3 + Math.random() * 0.5, rr = 0.6 + Math.random() * 1.2;
      Fx.spawn({ p: [PORTAL_POS[0] + Math.cos(a) * rr, 1.6 + Math.sin(a * 1.7) * 1.1, PORTAL_POS[2]],
                 c: [[0.7, 0.3, 1], [0.95, 0.4, 1], [1, 1, 1]][Math.floor(Math.random() * 3)],
                 v: [-Math.cos(a) * 0.9, 0, 0.2], g: 0, drag: 0.4, life: 0.6, s: 0.04, s1: 0.01 });
    }

    Cam.follow(hero.pos, camYaw, { dist: 4.4, height: 2.3 }, dt);
    Cam.update(dt);
  }

  const mTmp = M3.mat();
  function render3d(aspect) {
    const { view, proj } = Cam.matrices(aspect);
    Gfx.begin(view, proj, ENV);
    Gfx.draw(staticH, null, {});
    const bob = moving ? Math.abs(Math.sin(bobT)) * 0.05 : 0;
    Gfx.draw(hero.h, M3.trs(mTmp, [hero.pos[0], hero.pos[1] + bob, hero.pos[2]], [hero.yaw, 0, 0], [1, 1, 1]), {});
    for (const n of NPCS) {
      const nb = 1 + 0.012 * Math.sin(t * 1.8 + n.pos[0]);
      Gfx.draw(n.h, M3.trs(mTmp, n.pos, [n.yaw, 0, 0], [1, nb, 1]), {});
    }
    const pd = Fx.particleData();
    Gfx.drawDynamic(pd.data, pd.count);
  }

  function renderUi(ctx) {
    if (cardT > 0) UI.locationCard(ctx, 'WHISPER GROVE', M3.clamp(cardT, 0, 1));
    if (hintT > 0) UI.hint(ctx, ['WASD/Arrows: Move', 'E: Talk / Confirm', 'M: Mute   T: Stats']);
    if (dialogue) { UI.msgBox(ctx, dialogue.tw, t, true); return; }
    if (Fx.transitioning()) return;
    const near = nearest();
    if (near) UI.prompt(ctx, near.kind === 'portal' ? 'E  Enter the Rift' : 'E  Talk');
  }

  function exit() { Fx.clear(); }

  return { enter, update, render3d, renderUi, exit };
})();
</script>
<script>
/* Grove Clash — js/main.js
   Game: boot, adaptive-resolution canvas system, fixed-timestep loop,
   scene switching with transitions, persistent save, on-screen error
   overlay and debug hash modes.

   RESOLUTION & FRAMERATE
   The 3D world renders to a backing store that scales DOWN to protect a
   hard 60 FPS floor and UP toward an 8K ceiling whenever the GPU has
   headroom (adaptive supersampling). The 2D UI keeps a fixed 960x540
   virtual coordinate system (so ui.js never changes) but its backing
   store is rendered at display/high resolution via a context scale, so
   panels and text stay razor-crisp at any size. A live HUD (toggle: T)
   reports FPS and the actual render resolution.

   Hash modes: #battle #fly #viewer ; #8k forces the 8K ceiling (adaptive
   off) ; #retro restores the original 480x270 pixelated look. */
const Game = (() => {

  const UI_VW = 960, UI_VH = 540;   // virtual UI coordinate space (fixed)
  const AR = 16 / 9;
  const STEP = 1 / 60;              // fixed simulation step
  const CAP_W = 7680;              // 8K width ceiling
  const UI_CAP = 3840;            // UI backing capped at 4K wide (crisp enough; bounds memory)
  const MIN_GL_W = 480;          // never scale the 3D world below this

  let glCanvas = null, uiCanvas = null, ctx = null, stage = null;
  let scene = null;
  let acc = 0, last = 0;
  let errorLines = null;
  let viewRect = { left: 0, top: 0, w: 1, h: 1 };
  const handles = {};

  // resolution / perf state
  let dpr = 1, cssW = UI_VW, cssH = UI_VH, uiScale = 1;
  let ceilingW = CAP_W, minScale = 1, glScale = 1, glW = UI_VW, glH = UI_VH;
  let adaptiveOn = true, started = false, retro = false;
  let emaMs = 16.7, adaptCount = 0;
  let showStats = true;

  // hp: null means "full HP" (resolved against statsFor at battle start)
  const save = {
    party: [
      { species: 'PIXLIT', level: 10, hp: 17 }, // worn from the journey
      { species: 'THORNLET', level: 9, hp: null },
      { species: 'EMBERIK', level: 9, hp: null },
    ],
    npcs: {},            // npcId -> true once that trainer is beaten
    bossBeaten: false,
    bossCaptured: false,
    battles: 0,
  };

  function handle(name) {
    if (!handles[name]) handles[name] = Gfx.upload(Models.get(name));
    return handles[name];
  }

  // ------------------------------------------------------------ scenes
  // In battle the 3D "inner screen" is inset so the red frame borders the
  // monsters instead of overlapping them (the top bar in particular clipped
  // the tall cliff-top boss). Kept 16:9 so the camera/scene are unchanged.
  const BATTLE_INSET = 0.09; // fraction of the stage inset on every side
  let glInset = false;
  function applyGlInset(on) {
    if (on === glInset || !glCanvas) return;
    glInset = on;
    if (on) {
      const m = (BATTLE_INSET * 100) + '%', sz = ((1 - 2 * BATTLE_INSET) * 100) + '%';
      glCanvas.style.left = m; glCanvas.style.top = m;
      glCanvas.style.width = sz; glCanvas.style.height = sz;
    } else {
      glCanvas.style.left = '0'; glCanvas.style.top = '0';
      glCanvas.style.width = '100%'; glCanvas.style.height = '100%';
    }
  }

  function switchNow(name, params) {
    if (scene && scene.exit) scene.exit();
    scene = name === 'battle' ? Battle : Overworld;
    applyGlInset(name === 'battle');
    scene.enter(params || {});
  }

  function toBattle(opts) {
    opts = opts || {};
    save.battles++;
    const dungeon = opts.arena === 'dungeon';
    Sfx.play(dungeon ? 'rift' : 'spawn');
    Fx.transition(dungeon ? 'portalIn' : 'battleIn', () => switchNow('battle', opts), null);
  }

  function toDungeon() {
    toBattle({ arena: 'dungeon', enemy: { species: 'VORNETH', level: 16, isBoss: true, trainer: 'VORNETH' } });
  }

  function toOverworld(result, ctx) {
    Fx.transition('fade', () => switchNow('overworld', Object.assign({ result }, ctx || {})), null);
  }

  // called by Battle.endBattle: record progress, then return to the overworld
  function onBattleEnd(result, enemy) {
    if (result === 'win' || result === 'capture') {
      if (enemy && enemy.isBoss) { save.bossBeaten = true; if (result === 'capture') save.bossCaptured = true; }
      else if (enemy && enemy.npcId) save.npcs[enemy.npcId] = true;
    }
    toOverworld(result, { fromDungeon: !!(enemy && enemy.isBoss) });
  }

  // ----------------------------------------------------- resolution
  // Size the 3D backing store from the current adaptive scale (snapped to
  // 32px steps to avoid reallocating the backbuffer on every nudge).
  function applyRes() {
    let w = Math.round(ceilingW * glScale / 32) * 32;
    w = M3.clamp(w, MIN_GL_W, ceilingW);
    const h = Math.round(w / AR);
    if (glCanvas.width !== w || glCanvas.height !== h) {
      glCanvas.width = w;
      glCanvas.height = h;
    }
    glW = glCanvas.width; glH = glCanvas.height;
  }

  function resize() {
    const fit = Math.min(window.innerWidth / UI_VW, window.innerHeight / UI_VH);
    cssW = Math.max(1, Math.round(UI_VW * fit));
    cssH = Math.max(1, Math.round(UI_VH * fit));
    stage.style.width = cssW + 'px';
    stage.style.height = cssH + 'px';
    const r = stage.getBoundingClientRect();
    viewRect = { left: r.left, top: r.top, w: cssW, h: cssH };

    // UI backing store: crisp at display resolution, capped at 4K wide.
    const uiW = retro ? UI_VW : M3.clamp(Math.round(cssW * dpr), UI_VW, UI_CAP);
    uiScale = uiW / UI_VW;
    const uiWpx = Math.round(UI_VW * uiScale), uiHpx = Math.round(UI_VH * uiScale);
    if (uiCanvas.width !== uiWpx || uiCanvas.height !== uiHpx) {
      uiCanvas.width = uiWpx; uiCanvas.height = uiHpx;
      ctx.imageSmoothingEnabled = false; // canvas resize resets context state
    }

    // First sizing: start the 3D world at display-native scale, then let
    // the adaptive controller climb toward 8K if there's headroom.
    if (!started) {
      glScale = adaptiveOn ? M3.clamp((cssW * dpr) / ceilingW, minScale, 1) : 1;
      started = true;
    }
    applyRes();
  }

  // Hold 60 FPS: shed resolution when frames run long, reclaim it (toward
  // the 8K ceiling) when there's spare budget. Hysteresis avoids churn.
  function adaptTick() {
    if (!adaptiveOn) return;
    if (++adaptCount < 30) return;
    adaptCount = 0;
    if (emaMs > 17.5 && glScale > minScale) {
      glScale = Math.max(minScale, glScale * 0.82); applyRes();
    } else if (emaMs < 14.0 && glScale < 1) {
      glScale = Math.min(1, glScale * 1.10); applyRes();
    }
  }

  function mapper(cx, cy) {
    const x = (cx - viewRect.left) / viewRect.w * UI_VW;
    const y = (cy - viewRect.top) / viewRect.h * UI_VH;
    if (x < 0 || y < 0 || x > UI_VW || y > UI_VH) return null;
    return { x, y };
  }

  // ------------------------------------------------------- error overlay
  function showError(msg) {
    errorLines = String(msg).split('\n').slice(0, 8);
  }

  function drawErrorOverlay() {
    if (!errorLines || !ctx) return;
    ctx.save();
    ctx.fillStyle = 'rgba(120,16,16,0.92)';
    ctx.fillRect(20, 20, 920, 40 + errorLines.length * 20);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('ERROR (see console for details):', 32, 44);
    for (let i = 0; i < errorLines.length; i++)
      ctx.fillText(errorLines[i].slice(0, 110), 32, 66 + i * 20);
    ctx.restore();
  }

  function drawHud() {
    if (!showStats) return;
    const fps = Math.min(999, Math.round(1000 / Math.max(0.001, emaMs)));
    const atCeil = glW >= ceilingW - 32;
    const tag = (atCeil && ceilingW >= 7000) ? ' 8K' : (atCeil && ceilingW >= 3500 ? ' 4K' : '');
    const txt = fps + ' FPS  ' + glW + 'x' + glH + tag;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(4, 46, PFont.width(txt, 1) + 12, 16);
    PFont.draw(ctx, txt, 10, 48, { scale: 1, color: fps >= 58 ? '#7cfc6a' : '#f8c838', outline: '#101018' });
  }

  // ------------------------------------------------------------- viewer
  const Viewer = (() => {
    let names = [], idx = 0, vt = 0;
    const env = {
      sky: M3.hex('#1a2335'), fog: M3.hex('#1a2335'), fogNear: 30, fogFar: 60,
      lightDir: M3.normalize([], [-0.4, -0.75, 0.3]),
      lightCol: [0.85, 0.8, 0.7], ambient: [0.5, 0.5, 0.52],
    };
    const m = M3.mat();
    return {
      enter() { names = Models.list(); idx = 0; vt = 0; },
      update(dt) {
        vt += dt;
        if (Input.pressed('right')) { idx = (idx + 1) % names.length; Sfx.play('cursor'); }
        if (Input.pressed('left')) { idx = (idx + names.length - 1) % names.length; Sfx.play('cursor'); }
      },
      render3d(aspect) {
        const name = names[idx];
        const mod = Models.get(name);
        const r = Math.max(2.6, mod.height * 2.2);
        const eye = [Math.sin(vt * 0.7) * r, mod.height * 0.75, Math.cos(vt * 0.7) * r];
        const { view, proj } = (() => {
          const v = M3.mat(), p = M3.mat();
          M3.lookAt(v, eye, [0, mod.height * 0.45, 0], [0, 1, 0]);
          M3.persp(p, 40, aspect, 0.1, 100);
          return { view: v, proj: p };
        })();
        Gfx.begin(view, proj, env);
        Gfx.draw(handle(name), M3.ident(m), {});
      },
      renderUi(c) {
        UI.hint(c, ['MODEL VIEWER  (Left/Right to cycle)',
                    names[idx] + '  (' + Models.get(names[idx]).count + ' verts)']);
      },
      exit() {},
    };
  })();

  // ---------------------------------------------------------------- loop
  function update(dt) {
    Fx.update(dt);
    Input.setTouchLayout(scene === Battle ? 'battle' : 'overworld');
    if (Input.pressed('mute')) Sfx.toggleMute();
    if (Input.pressed('stats')) showStats = !showStats;
    if (scene && scene.update) scene.update(dt);
    Input.postUpdate();
  }

  function render() {
    if (!scene) return;
    scene.render3d(glW / glH);
    // all UI draws happen in the fixed 960x540 space; the transform scales
    // them up to the high-resolution backing store.
    ctx.setTransform(uiScale, 0, 0, uiScale, 0, 0);
    ctx.clearRect(0, 0, UI_VW, UI_VH);
    scene.renderUi(ctx);
    const fa = Fx.flashAlpha();
    if (fa > 0) {
      const fc = Fx.flashColor();
      ctx.globalAlpha = M3.clamp(fa, 0, 1);
      ctx.fillStyle = 'rgb(' + (fc[0] * 255 | 0) + ',' + (fc[1] * 255 | 0) + ',' + (fc[2] * 255 | 0) + ')';
      ctx.fillRect(0, 0, UI_VW, UI_VH);
      ctx.globalAlpha = 1;
    }
    Fx.transitionDraw(ctx);
    if (Sfx.isMuted())
      PFont.draw(ctx, 'MUTED', 884, 8, { scale: 2, color: '#f8c838' });
    drawHud();
    Input.drawTouch(ctx);
    drawErrorOverlay();
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const real = (now - last) / 1000 || 0.016;
    last = now;
    emaMs = emaMs * 0.9 + (real * 1000) * 0.1;
    try {
      acc += Math.min(0.1, real);
      let n = 0;
      while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
      if (n === 5) acc = 0;
      render();
    } catch (e) {
      showError((e && e.stack) || e);
      try { render(); } catch (e2) { /* keep the loop alive */ }
      console.error(e);
    }
    adaptTick();
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    stage = document.getElementById('stage');
    glCanvas = document.getElementById('gl');
    uiCanvas = document.getElementById('ui');
    ctx = uiCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    window.onerror = (msg, src, line) => { showError(msg + '\n' + (src || '') + ':' + (line || '')); };
    window.addEventListener('unhandledrejection', (e) => showError('Promise: ' + e.reason));

    let glOk = false;
    try { glOk = Gfx.init(glCanvas); }
    catch (e) { showError('WebGL init failed:\n' + ((e && e.message) || e)); }
    if (!glOk) {
      uiCanvas.width = UI_VW; uiCanvas.height = UI_VH;
      if (!errorLines) showError('WebGL is not available in this browser.');
      drawErrorOverlay();
      return;
    }

    const href = location.href;
    dpr = window.devicePixelRatio || 1;
    retro = /[#&?]retro/.test(href);
    const force8k = /[#&?]8k/.test(href);
    const gpuMax = Gfx.maxDim();
    ceilingW = retro ? MIN_GL_W : Math.min(CAP_W, gpuMax);
    minScale = MIN_GL_W / ceilingW;
    adaptiveOn = !retro && !force8k;
    glScale = 1; // resize() sets the real starting scale
    const ir = retro ? 'pixelated' : 'auto';
    glCanvas.style.imageRendering = ir;
    uiCanvas.style.imageRendering = ir;

    Input.init({ mapper, onFirstInteraction: () => Sfx.unlock() });
    window.addEventListener('resize', resize);
    resize();

    const hash = location.hash;
    if (hash.indexOf('viewer') >= 0) { scene = Viewer; scene.enter(); }
    else if (hash.indexOf('fly') >= 0) { scene = Battle; scene.enter({ fly: true }); }
    else if (hash.indexOf('dungeon') >= 0) { scene = Battle; scene.enter({ arena: 'dungeon', enemy: { species: 'VORNETH', level: 16, isBoss: true, trainer: 'VORNETH' } }); }
    else if (hash.indexOf('battle') >= 0) { scene = Battle; scene.enter({}); }
    else { scene = Overworld; scene.enter({}); }
    applyGlInset(scene === Battle);

    requestAnimationFrame((now) => { last = now; requestAnimationFrame(loop); });
  }

  return { boot, save, handle, toBattle, toDungeon, toOverworld, onBattleEnd };
})();

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', () => Game.boot());
  else
    Game.boot();
}
</script>
